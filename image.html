<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick 4 - Image Passcode</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Give your Agent passcode</h1>
        
        <div class="passcode-box">
            <input 
                type="text" 
                class="passcode-input" 
                id="passcodeInput" 
                placeholder="Enter 5-digit code" 
                maxlength="5"
                pattern="[0-9]*"
                inputmode="numeric"
            >
        </div>

        <button class="submit-btn" onclick="checkPasscode()">Submit</button>

        <div class="error-message" id="errorMessage">
            Invalid passcode! Please try again.
        </div>

        <div class="success-message" id="successMessage">
            Access granted!
        </div>

        <div class="image-container" id="imageContainer">
            <img id="secretImage" src="" alt="Secret Image">
        </div>
    </div>

    <script>
        // Set your 5-digit passcode here
        const CORRECT_PASSCODE = "12345";
        
        // Set the image path relative to this HTML file
        const IMAGE_PATH = "Images/IMG-20260503-WA0026.jpg";

        function checkPasscode() {
            const input = document.getElementById('passcodeInput');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const imageContainer = document.getElementById('imageContainer');
            const secretImage = document.getElementById('secretImage');

            const enteredCode = input.value.trim();

            if (enteredCode === CORRECT_PASSCODE) {
                // Correct passcode
                errorMessage.style.display = 'none';
                successMessage.style.display = 'block';
                imageContainer.style.display = 'block';
                secretImage.src = IMAGE_PATH;
                
                // Disable input after successful entry
                input.disabled = true;
            } else {
                // Incorrect passcode
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
                imageContainer.style.display = 'none';
                input.value = '';
                input.focus();
            }
        }

        // Allow Enter key to submit
        document.getElementById('passcodeInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPasscode();
            }
        });

        // Only allow numbers
        document.getElementById('passcodeInput').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
